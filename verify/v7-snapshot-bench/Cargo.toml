[package]
name = "verify-v7-snapshot-bench"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "snapshot_bench"
path = "src/lib.rs"

[[bench]]
name = "snapshot"
harness = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
criterion = { version = "0.5", features = ["html_reports"] }
