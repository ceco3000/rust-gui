[package]
name = "rgui-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "rgui 渲染引擎（单一 vello 后端）：字形/路径细分/文本/场景图"

[dependencies]
rgui-core.workspace = true

# 重型 GPU 依赖经 vello-backend feature 引入（单一 vello，无 skia 多后端抽象）
vello = { version = "0.9", optional = true }
wgpu = { version = "29", optional = true }
cosmic-text = { version = "0.12", optional = true }
fontdb = { version = "0.16", optional = true }
skrifa = { version = "0.22", optional = true }
pollster = { version = "0.4", optional = true }

[features]
default = []
# 单一 vello 渲染后端：wgpu/vello/cosmic-text/fontdb/skrifa（仅这一条渲染路径；无 skia/offscreen 变体）
vello-backend = [
    "dep:vello",
    "dep:wgpu",
    "dep:cosmic-text",
    "dep:fontdb",
    "dep:skrifa",
    "dep:pollster",
]

[lints]
workspace = true
