[package]
name = "rgui-render"
description = "rgui 渲染管线——SceneGraph、Vello/Skia 后端、字形 Atlas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["gui", "render", "gpu", "vello", "wgpu"]
categories = ["gui", "rendering"]

[dependencies]
rgui-core.workspace = true
rustc-hash.workspace = true
log.workspace = true
thiserror.workspace = true
wgpu = { workspace = true, optional = true }
vello = { workspace = true, optional = true }
cosmic-text = { workspace = true, optional = true }
fontdb = { workspace = true, optional = true }
skrifa = { version = "0.42", optional = true }
linebender_resource_handle = { workspace = true, optional = true }
skia-safe = { version = "0.82", optional = true }
raw-window-handle = { version = "0.6", optional = true }
pollster = { version = "0.4", optional = true }

[features]
default = ["vello-backend"]
vello-backend = ["dep:wgpu", "dep:vello", "dep:cosmic-text", "dep:fontdb", "dep:skrifa", "dep:linebender_resource_handle", "dep:raw-window-handle", "dep:pollster"]
skia-backend = ["dep:skia-safe"]
offscreen = ["dep:image", "skia-backend"]

[dependencies.image]
workspace = true
optional = true
