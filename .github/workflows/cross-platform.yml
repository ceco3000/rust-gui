# V4: Cross-platform build verification
# Ref: docs/Rust GUI 框架技术路线验证设计.md §V4

name: V4 Cross-Platform Build

on:
  push:
    paths:
      - 'verify/v1-vello-cosmic/**'
      - '.github/workflows/cross-platform.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1-mesa-dev libgl1-mesa-dri libxkbcommon-dev

      - name: Build V1 POC (release)
        run: cargo build --release --manifest-path verify/v1-vello-cosmic/Cargo.toml
        timeout-minutes: 15
