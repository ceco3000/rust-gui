# RUST-GUI 框架 CI
# 对齐 docs/D9-测试策略与基础设施设计.md §7 CI 矩阵
#
# 触发条件：
#   push: 单元测试 + lint（每次 commit）
#   pull_request: 集成测试 + 截图回归（每次 PR）
#   workflow_dispatch: 手动触发全部

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'rgui-*/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'rgui-*/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==========================================================================
  # 每次 commit：代码风格与基础编译
  # ==========================================================================
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # ==========================================================================
  # 每次 commit + PR：单元测试（MSRV + stable，三平台）
  # ==========================================================================
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ['1.85', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1-mesa-dev libgl1-mesa-dri libxkbcommon-dev libfontconfig1-dev libfreetype6-dev

      - name: Build
        run: cargo build --workspace
        timeout-minutes: 15

      - name: Test (unit)
        run: cargo test --workspace --lib
        timeout-minutes: 10

  # ==========================================================================
  # PR：集成测试
  # ==========================================================================
  integration-test:
    name: Integration Test (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1-mesa-dev libgl1-mesa-dri libxkbcommon-dev libfontconfig1-dev libfreetype6-dev

      - name: Integration tests
        run: cargo test --workspace --test '*'
        timeout-minutes: 15

  # ==========================================================================
  # PR：覆盖率
  # ==========================================================================
  coverage:
    name: Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install Linux deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1-mesa-dev libgl1-mesa-dri libxkbcommon-dev libfontconfig1-dev libfreetype6-dev

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
        timeout-minutes: 20

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ==========================================================================
  # PR：截图回归测试（离屏渲染 + PNG 比对）
  # ==========================================================================
  screenshots:
    name: Screenshot Regression (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1-mesa-dev libgl1-mesa-dri libxkbcommon-dev libfontconfig1-dev libfreetype6-dev

      - name: Screenshot tests
        run: cargo test --workspace -- --ignored screenshot
        timeout-minutes: 15

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: '**/screenshots/diff/'

  # ==========================================================================
  # Release：E2E 冒烟测试
  # ==========================================================================
  e2e:
    name: E2E Smoke
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1-mesa-dev libgl1-mesa-dri libxkbcommon-dev libfontconfig1-dev libfreetype6-dev

      - name: E2E smoke tests
        run: cargo test --workspace -- --ignored e2e
        timeout-minutes: 15
