# RUST-GUI 测试基础设施配置
# 对齐 docs/D9-测试策略与基础设施设计.md

[alias]
# 快捷覆盖率命令：生成 lcov 报告
cov = ["llvm-cov", "--workspace", "--lcov", "--output-path", "lcov.info"]

# 本地 CI 模拟命令
ci-check = ["test", "--workspace", "--lib"]
ci-integration = ["test", "--workspace", "--test", "'*'"]
ci-screenshots = ["test", "--workspace", "--", "--ignored", "screenshot"]
ci-e2e = ["test", "--workspace", "--", "--ignored", "e2e"]

[build]
# 测试构建使用 debug 模式（CI 中覆盖率更快）
rustflags = []

[target.x86_64-unknown-linux-gnu]
linker = "cc"

[env]
# 离屏渲染测试环境变量（避免依赖物理 GPU）
# 渲染后端检测此变量后切换为软件渲染路径
# 使用方式：RUST_GUI_OFFSCREEN=1 cargo test
# RUST_GUI_OFFSCREEN = "1"
