[package]
name = "rgui-devtools"
description = "rgui 开发工具——文件监控、热重载、快速重启、双进程通信"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["gui", "devtools", "hot-reload"]
categories = ["gui", "development-tools"]

[features]
default = ["notify", "serde_json"]
notify = ["dep:notify"]
serde_json = ["dep:serde_json"]
html-hot-reload = ["dep:quick-xml"]

[dependencies]
rgui-core.workspace = true
rgui-state.workspace = true
rgui-style.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
postcard.workspace = true
notify = { workspace = true, optional = true }
quick-xml = { version = "0.36", optional = true }
ordered-float.workspace = true
log.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
